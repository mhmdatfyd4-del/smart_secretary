<h1>سياسة الخصوصية لتطبيق سكرتيري</h1>
<p>تطبيق سكرتيري لا يجمع أي بيانات شخصية. كل بياناتك (مواعيدك، يومياتك، ملاحظاتك) محفوظة على جهازك فقط.</p>
<p>الأذونات (المايك، الإشعارات، الكاميرا) تُستخدم فقط داخل التطبيق ولا يتم إرسالها لأي مكان.</p>
