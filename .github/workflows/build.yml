name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate missing Android files
        run: flutter create . --platforms=android --org com.example --project-name secretary_app

      # 🔴 الحل: نضيف gradle.properties يحدد compileSdk لكل الحزم
      - name: Configure Gradle properties
        run: |
          cat >> android/gradle.properties << 'EOF'
          
          android.compileSdkVersion=35
          android.buildToolsVersion=34.0.0
          android.enableJetifier=true
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
          EOF

      # 🔴 نحذف build.gradle اللي كنا عملناه (كان بيعمل مشاكل)
      - name: Clean custom build.gradle
        run: |
          rm -f android/build.gradle
          flutter create --platforms=android --org com.example --project-name secretary_app .

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
