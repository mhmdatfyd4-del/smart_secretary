name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate missing Android files
        run: flutter create . --platforms=android --org com.example --project-name secretary_app

      # 🔴 الحل النهائي: نضيف compileSdkVersion لكل الحزم اللي محتاجاها
      - name: Patch all plugins to use compileSdkVersion 35
        run: |
          # نلاقي كل الحزم في pub cache ونعدلها
          PUB_CACHE="${HOME}/.pub-cache/hosted/pub.dev"
          
          # قائمة الحزم اللي محتاجة تعديل
          PLUGINS=(
            "geolocator_android"
            "flutter_local_notifications"
            "permission_handler_android"
            "wakelock_plus"
          )
          
          for plugin in "${PLUGINS[@]}"; do
            # نلاقي المجلد بالظبط (ممكن يكون فيه رقم إصدار)
            PLUGIN_DIR=$(find "$PUB_CACHE" -maxdepth 1 -type d -name "${plugin}-*" | head -1)
            
            if [ -n "$PLUGIN_DIR" ] && [ -f "$PLUGIN_DIR/android/build.gradle" ]; then
              echo "✅ تعديل: $PLUGIN_DIR"
              
              # لو الملف فيه android { } بدون compileSdkVersion، نضيفها
              if ! grep -q "compileSdkVersion" "$PLUGIN_DIR/android/build.gradle"; then
                # نضيف compileSdkVersion بعد كلمة android {
                sed -i 's/android {/android {\n    compileSdkVersion 35\n    buildToolsVersion "34.0.0"/' "$PLUGIN_DIR/android/build.gradle"
              fi
            fi
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
