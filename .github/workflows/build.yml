name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate missing Android files
        run: flutter create . --platforms=android --org com.example --project-name secretary_app

      # 🔴 الحل: نضيف compileSdkVersion لأي حزمة ناقصة
      - name: Patch plugins missing compileSdkVersion
        run: |
          PUB_CACHE="$HOME/.pub-cache/hosted/pub.dev"
          echo "🔍 Searching in: $PUB_CACHE"
          
          # ندوّر على كل ملفات build.gradle في الحزم
          find "$PUB_CACHE" -name "build.gradle" -path "*/android/*" | while read -r gradle_file; do
            # لو الملف فيه "android {" بس مفيش compileSdkVersion
            if grep -q "^android {" "$gradle_file" && ! grep -q "compileSdkVersion" "$gradle_file"; then
              echo "📝 Patching: $gradle_file"
              # نضيف compileSdkVersion بعد android {
              sed -i 's/^android {/android {\n    compileSdkVersion 35\n    buildToolsVersion "34.0.0"/' "$gradle_file"
            fi
          done
          
          echo "✅ Done patching"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
