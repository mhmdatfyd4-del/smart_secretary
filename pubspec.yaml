name: secretary_app
description: "Smart Secretary App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.1
  sensors_plus: ^5.0.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  pray_times: ^0.0.1
  wakelock_plus: ^1.2.5
  cupertino_icons: ^1.0.8

# 🔴 الحل: نجبر Flutter يستخدم نسخة قديمة من package_info_plus
dependency_overrides:
  package_info_plus: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
