name: secretary_app
description: "Smart Secretary App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الصوت (الحالي - آلي)
  flutter_tts: ^3.8.5

  # التعرف على الصوت
  speech_to_text: ^6.6.1

  # الهز
  sensors_plus: ^5.0.1

  # التخزين المحلي
  shared_preferences: ^2.2.2

  # التواريخ العربية
  intl: ^0.19.0

  # الأذونات
  permission_handler: ^11.3.1

  # المنبه في الخلفية + الإشعارات
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # مواقيت الصلاة
  adhan: ^2.0.0
  geolocator: ^12.0.0

  # إبقاء الشاشة صاحية وقت التنبيه
  wakelock_plus: ^1.2.5

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
