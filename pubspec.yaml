name: secretary_app
description: "Smart Secretary App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  sensors_plus: ^4.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  permission_handler: ^11.0.1
  flutter_local_notifications: ^15.0.1
  timezone: ^0.9.2
  wakelock_plus: ^1.1.4
  adhan: ^2.0.0
  cupertino_icons: ^1.0.8

  # المسجل الصوتي
  record: ^5.0.4
  audioplayers: ^5.2.1
  path_provider: ^2.1.3

  # المشاركة
  share_plus: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/secretary.jpg
    - assets/maryam.jpg
    - assets/nada.jpg
    - assets/noor.jpg
    - assets/yasmine.jpg
