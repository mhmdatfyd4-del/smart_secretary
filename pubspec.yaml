name: secretary_app
description: "Smart Secretary App"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 👇 مكتبات Firebase الجديدة
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  flutter_secure_storage: ^9.2.2

  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  sensors_plus: ^4.0.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1
  hijri: ^3.0.0
  permission_handler: ^11.0.1
  flutter_local_notifications: ^15.0.1
  timezone: ^0.9.2
  wakelock_plus: ^1.1.4
  adhan: ^2.0.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  record: ^5.0.4
  audioplayers: ^5.2.1
  path_provider: ^2.1.3
  share_plus: ^7.2.1
  url_launcher: ^6.2.5
  font_awesome_flutter: 10.8.0
  google_sign_in: ^6.2.1
device_info_plus: ^11.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/secretary.png
    - assets/maryam.png
    - assets/nada.png
    - assets/noor.png
    - assets/yasmine.png
    - assets/mohamed.png
    - assets/ahmed.png
    - assets/ali.png
    - assets/omar.png
    - assets/youssef.png
    - assets/sounds/
    - assets/splash.png
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#1B2A4A"
  adaptive_icon_foreground: "assets/logo.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#1B2A4A"
  image: assets/splash.png
  android: true
  ios: false
  android_12:
    color: "#1B2A4A"
    image: assets/splash.png
  fullscreen: true
