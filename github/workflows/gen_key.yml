name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore and Base64
        run: |
          # إنشاء ملف التوقيع بالاسم والباسورد بتوعك
          keytool -genkey -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias Mss -storepass A741852963e -keypass A741852963e -dname "CN=Ahmed, OU=Dev, O=App, L=Cairo, ST=Cairo, C=EG"
          
          # تحويل الملف لصيغة Base64 وطباعته
          echo "================= انسخ الكود اللي تحت ده كله ================="
          base64 -w 0 my-release-key.jks
          echo ""
          echo "=============================================================="
